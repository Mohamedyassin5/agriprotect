spring.application.name=agri

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/agri?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT settings
jwt.secret=change_this_secret_to_a_secure_random_value
jwt.expirationMs=3600000
#mail settings
app.name=Agri
app.mail.from=no-reply@agri.tn

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# AI service settings
agri.ai.base-url=http://localhost:8000
agri.ai.model=xgb
agri.ai.timeout-ms=3000
# Face service settings
agri.face.base-url=http://localhost:8001
agri.face.timeout-ms=20000
# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# GROQ AI CONFIGURATION

groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.api.url=https://api.groq.com/openai/v1
groq.api.model=llama-3.3-70b-versatile
groq.api.timeout-ms=30000
groq.api.max-tokens=1024
groq.api.temperature=0.7


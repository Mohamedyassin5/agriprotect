# AI service settings
agri.ai.base-url=http://localhost:8000
agri.ai.model=xgb
agri.ai.timeout-ms=3000

# Finance ML AI service (Module 2 + Module 3 from notebook)
finance.ai.base-url=http://localhost:8002
finance.ai.timeout-ms=10000

# Face service settings
agri.face.base-url=http://localhost:8001
agri.face.timeout-ms=20000

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# GROQ AI CONFIGURATION
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.api.url=https://api.groq.com/openai/v1
groq.api.vision-model=meta-llama/llama-4-scout-17b-16e-instruct
groq.api.model=llama-3.3-70b-versatile
groq.api.timeout-ms=30000
groq.api.max-tokens=1024
groq.api.temperature=0.7

# Stripe
stripe.api.key=YOUR_STRIPE_TEST_KEY_HERE
stripe.webhook.secret=YOUR_STRIPE_WEBHOOK_SECRET_HERE
stripe.success.url=http://localhost:8081/payment-success
stripe.cancel.url=http://localhost:8081/payment-cancel

# RISK DETECTION & SINISTRE CONFIGURATION
risk.detection.enabled=true
risk.detection.auto-check=true
risk.detection.schedule-cron=0 0 6,12,18 * * *
risk.quota.daily-limit=5
risk.quota.monthly-limit=50

# WEATHER API CONFIGURATION (Open-Meteo - Gratuit, sans cle)
weather.api.url=https://api.open-meteo.com/v1
weather.api.timeout-ms=10000
weather.default.latitude=36.8065
weather.default.longitude=10.1686
weather.cache.ttl-minutes=30

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

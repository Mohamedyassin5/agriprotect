<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Régularisation - AgriProtect</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        #payment-element {
            background-color: white;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }
        .loading { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

<div class="max-w-md w-full mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-orange-600 to-red-600 px-8 py-6 text-white">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-rotate-right text-3xl"></i>
            <div>
                <h1 class="text-2xl font-semibold">Régularisation de Police</h1>
                <p class="text-orange-100 text-sm">AgriProtect • Paiement des arriérés</p>
            </div>
        </div>
    </div>

    <div class="p-8">
        <div class="mb-8 p-6 bg-orange-50 rounded-2xl border border-orange-100">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600">Référence assurance</span>
                <span id="insurance-id-display" class="font-medium text-gray-900"></span>
            </div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600">Montant total dû</span>
                <span id="amount-display" class="text-3xl font-semibold text-red-700">— TND</span>
            </div>
            <div id="penalty-row" class="hidden flex justify-between items-center text-sm text-orange-600">
                <span>Pénalité de retard</span>
                <span id="penalty-amount" class="font-medium"></span>
            </div>
            <p class="text-xs text-orange-700 mt-4">Ce paiement permettra de réactiver votre couverture immédiatement.</p>
        </div>

        <form id="payment-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Méthode de paiement</label>
                <div id="payment-element"></div>
                <div id="card-errors" class="mt-2 text-red-600 text-sm min-h-[1.25rem]"></div>
            </div>

            <button id="payBtn" type="button"
                    class="w-full bg-red-600 hover:bg-red-700 transition-colors text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-3 text-lg shadow-md">
                <span id="pay-text">Régulariser et payer</span>
                <span id="pay-amount" class="font-bold"></span>
            </button>
        </form>
    </div>
</div>

<script>
    const stripe = Stripe("pk_test_51T4idXJ018n6rsEMLPU6Lc5Y1q2DBS84sFxSgoF42rFpRdC7wbn6a5J00AuSHj6EUGhg1NhV6fJmk7HRZzsCcqw500iOqlX3dM");

    const params = new URLSearchParams(window.location.search);
    const insuranceId = params.get("insuranceId");
    const token = params.get("token");

    if (insuranceId) {
        document.getElementById("insurance-id-display").textContent = insuranceId;
    }

    let clientSecret = null;
    let amount = 0;
    let elementsInstance = null;   // Pour garder l'instance elements

    async function initRegularization() {
        if (!token || !insuranceId) {
            alert("Paramètres manquants dans l'URL (insuranceId et token requis)");
            return;
        }

        try {
            const response = await fetch(`http://localhost:8081/agri/phase1/${insuranceId}/regularize-payment`, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) throw new Error(`Erreur serveur ${response.status}`);

            const data = await response.json();
            clientSecret = data.clientSecret;
            amount = parseFloat(data.totalAmount) || 0;        // ← Correction ici : totalAmount

            document.getElementById("amount-display").textContent = amount.toFixed(2) + " TND";
            document.getElementById("pay-amount").textContent = amount.toFixed(2) + " TND";

            const penalty = parseFloat(data.penaltyAmount) || 0;
            if (penalty > 0) {
                document.getElementById("penalty-row").classList.remove("hidden");
                document.getElementById("penalty-amount").textContent = `+ ${penalty.toFixed(2)} TND`;
            }

            // Création du Payment Element (méthode moderne recommandée)
            elementsInstance = stripe.elements({ clientSecret });
            const paymentElement = elementsInstance.create('payment', { layout: 'tabs' });
            paymentElement.mount("#payment-element");

        } catch (err) {
            console.error(err);
            alert("Impossible de charger la régularisation : " + err.message);
        }
    }

    // === Exécution du paiement ===
    const payBtn = document.getElementById("payBtn");
    const cardErrors = document.getElementById("card-errors");

    payBtn.addEventListener("click", async () => {
        if (!clientSecret || !elementsInstance) {
            return alert("Paiement non prêt. Veuillez patienter.");
        }

        payBtn.disabled = true;
        payBtn.innerHTML = `<i class="fa-solid fa-spinner loading"></i><span>Régularisation en cours...</span>`;

        try {
            const { error, paymentIntent } = await stripe.confirmPayment({
                elements: elementsInstance,
                confirmParams: {
                    return_url: "http://localhost:8081/payment-success?type=regularization"
                }
            });

            if (error) {
                cardErrors.textContent = error.message;
                payBtn.disabled = false;
                payBtn.innerHTML = `<span>Régulariser et payer</span><span class="font-bold">${amount.toFixed(2)} TND</span>`;
            } else if (paymentIntent && paymentIntent.status === "succeeded") {
                // Succès immédiat (rare avec redirect)
                showSuccessPage(paymentIntent.id);
            }
        } catch (err) {
            console.error(err);
            cardErrors.textContent = "Une erreur inattendue est survenue.";
            payBtn.disabled = false;
        }
    });

    function showSuccessPage(paymentIntentId) {
        document.body.innerHTML = `
          <div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 text-center">
              <div class="mx-auto w-20 h-20 bg-green-100 rounded-2xl flex items-center justify-center mb-6">
                <i class="fa-solid fa-check text-5xl text-green-600"></i>
              </div>
              <h2 class="text-3xl font-semibold text-green-700 mb-3">Régularisation réussie !</h2>
              <p class="text-gray-600 mb-8">Votre police est maintenant réactivée.<br>Couverture active.</p>
              <a href="http://localhost:8081/agri/phase1/my-insurances"
                 class="inline-block bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-2xl font-medium">
                Retour à mes assurances
              </a>
            </div>
          </div>`;
    }

    // Lancer l'initialisation
    initRegularization();
</script>
</body>
</html>
